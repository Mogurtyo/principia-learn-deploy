    <!-- Every clause here has to name something the build actually ships. The
         previous tail, "Turn lecture notes into exam mastery", promised a thing
         the app has never done — it does not read, import or do anything at all
         with a student's own notes — and a search snippet is the one piece of
         copy a student reads before they can see for themselves that it is not
         true. What follows is the shipped feature list: lessons with worked
         answers (MarkScheme), the review archive (PracticeScreen), mock and
         final exams (ExamScreen) and the per-unit guidebooks (9 units, 9
         guidebooks).
         "Spaced-repetition" was the second such claim and went the same way:
         course.ts reviewDueLessons brings a lesson back seven days on, or at
         once below 80% — a flat rule, not the expanding intervals the term
         names. The landing page's own card carries the honest wording now. -->
    <meta name="description" content="Interactive lessons with worked answers, targeted review of what you got wrong, mock exams and per-unit guidebooks for university STEM courses." />
    <meta name="theme-color" content="#002147" />
    <meta property="og:title" content="Principia — Master the Foundations of STEM" />
    <meta property="og:description" content="Interactive lessons with worked answers, targeted review of what you got wrong, mock exams and per-unit guidebooks for university STEM courses." />
    <meta property="og:type" content="website" />
    <title>Principia — Master the Foundations of STEM</title>
    <script>
      /* Paint the right theme on the very first frame. The store only learns the
         saved theme after an async Preferences read, which on the web is one
         localStorage key — read it here so a dark-mode learner never gets a
         white flash on launch. applyTheme() re-runs and agrees a tick later. */
      ;(function () {
        try {
          var raw = localStorage.getItem('CapacitorStorage.principia.settings.v1')
          var theme = raw ? (JSON.parse(raw) || {}).theme : 'system'
          if (theme !== 'light' && theme !== 'dark') theme = 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private mode / storage disabled: the store sorts it out on init */
        }
      })()
    </script>
